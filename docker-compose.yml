services:
  proxy:
    image: nginx:1.27-alpine
    container_name: llm-guard-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      mock-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - llm_guard_network

  redis:
    image: redis:7-alpine
    container_name: llm-guard-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
    volumes:
      - llm_guard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - llm_guard_network

  mock-llm:
    image: hashicorp/http-echo:alpine
    container_name: llm-guard-mock-llm
    restart: unless-stopped
    command:
      - "-listen=:8080"
      - "-text=Mock LLM response from LLM-Guard"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - llm_guard_network

volumes:
  llm_guard_redis_data:
    name: llm-guard-redis-data

networks:
  llm_guard_network:
    name: llm-guard-network
    driver: bridge
