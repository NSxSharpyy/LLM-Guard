services:

  proxy:
    image: nginx:1.27-alpine
    container_name: llm-guard-proxy
    ports:
      - "8000:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-llm

  redis:
    image: redis:7-alpine
    container_name: llm-guard-redis

  mock-llm:
    image: hashicorp/http-echo:1.0.0
    container_name: llm-guard-mock-llm
    command:
      - "-listen=:8080"
      - "-text=Mock LLM response from LLM-Guard"
